<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Create a container that maintains a 16:9 aspect ratio */
        #slide-deck-container {
            position: relative;
            width: 100%;
            max-width: 1280px; /* Max width of the deck */
            margin-left: auto;
            margin-right: auto;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
        }

        #slide-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: opacity 0.3s ease-in-out;
        }

        #slide-container.transitioning {
            opacity: 0;
        }

        /* Progress bar */
        #progress-bar-container {
            width: 100%;
            max-width: 1280px;
            margin: 8px auto 0;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3399FF, #8B5CF6);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        /* Thumbnail panel */
        #thumbnail-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100vh;
            background-color: #111;
            border-right: 1px solid #333;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 100;
            padding: 10px;
        }

        #thumbnail-panel.open {
            transform: translateX(0);
        }

        #thumbnail-panel h3 {
            font-size: 14px;
            font-weight: bold;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #222;
            border: 2px solid #333;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
            position: relative;
        }

        .thumbnail:hover {
            border-color: #3399FF;
            transform: scale(1.02);
        }

        .thumbnail.active {
            border-color: #3399FF;
            box-shadow: 0 0 10px rgba(51, 153, 255, 0.5);
        }

        .thumbnail-number {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        #thumbnail-toggle {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 99;
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #thumbnail-toggle:hover {
            background-color: #3399FF;
            border-color: #3399FF;
        }

        #thumbnail-toggle.panel-open {
            left: 210px;
        }

        /* Timer */
        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #3399FF;
            background-color: #1a1a1a;
            padding: 8px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #timer-display button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s;
        }

        #timer-display button:hover {
            color: #fff;
        }

        /* Help overlay */
        #help-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        #help-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        #help-content {
            background-color: #1a1a1a;
            padding: 30px 40px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        #help-content h2 {
            color: #3399FF;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .shortcut-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .shortcut-row:last-child {
            border-bottom: none;
        }

        .shortcut-key {
            background-color: #333;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        /* Fullscreen mode */
        body.fullscreen-mode {
            padding: 0 !important;
            background-color: #000;
        }

        body.fullscreen-mode .max-w-6xl > h1,
        body.fullscreen-mode #progress-bar-container,
        body.fullscreen-mode .flex.items-center.justify-between {
            display: none !important;
        }

        body.fullscreen-mode #slide-deck-container {
            max-width: 100vw;
            max-height: 100vh;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        /* Fullscreen controls overlay */
        #fullscreen-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            display: none;
            gap: 15px;
            align-items: center;
            z-index: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body.fullscreen-mode #fullscreen-controls {
            display: flex;
        }

        body.fullscreen-mode:hover #fullscreen-controls,
        #fullscreen-controls:hover {
            opacity: 1;
        }

        #fullscreen-controls button {
            background: none;
            border: 1px solid #555;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        #fullscreen-controls button:hover {
            background-color: #3399FF;
            border-color: #3399FF;
        }

        #fullscreen-controls .slide-info {
            color: #888;
            font-size: 14px;
        }

        /* Base class for all slide objects */
        .slide-object {
            position: absolute;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        /* Class for text objects */
        .slide-text {
            white-space: pre-wrap; /* Respect newlines in the text */
            word-wrap: break-word; /* Break long words */
        }

        /* Class for image objects */
        .slide-image {
            background-size: cover;
            background-position: center;
        }

        /* Class for shape objects */
        .slide-shape {
            /* Handled by inline styles */
        }
        
        /* Class for table objects */
        .slide-table {
            border-collapse: collapse;
            width: 100%;
            height: 100%;
        }

        .slide-table th, .slide-table td {
            border: 1px solid; /* Border properties will be overridden by inline styles */
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }

        /* Modal styles */
        #gemini-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #gemini-modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        #gemini-modal {
            background-color: #1a1a1a; /* bg-gray-900 */
            color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        #gemini-modal-overlay.visible #gemini-modal {
            transform: scale(1);
        }

        /* Loading spinner */
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: #3B82F6; /* blue-500 */
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* On-slide button */
        .on-slide-button {
            position: absolute;
            background-color: #3399FF;
            color: white;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.5vw; /* Responsive font size */
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .on-slide-button:hover {
            background-color: #257fdb;
            transform: translateY(-2px);
        }

        /* Source links */
        .source-link {
            display: block;
            font-size: 0.9em;
            color: #AAAAAA;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
            text-decoration: none;
        }
        .source-link:hover {
            color: #3399FF;
        }
    </style>
</head>

                    console.warn(`Attempt ${attempts + 1} failed: ${error.message}. Retrying in ${delay}ms...`);
                    attempts++;
                    await sleep(delay);
                    delay *= 2; // Exponential backoff
                }
            }
            
            return { text: "Error: The API is currently unavailable. Please try again later.", sources: [] };
        }

        // --- MODAL FUNCTIONS ---

        /**
         * Displays the modal.
         * @param {string} title - The title to show in the modal header.
         * @param {string} contentHtml - The HTML content to display.
         * @param {boolean} isLoading - Whether to show the loading spinner.
         */
        function showModal(title, contentHtml, isLoading = false) {
            modalTitle.textContent = title;
            if (isLoading) {
                modalContent.innerHTML = '<div class="flex justify-center"><div class="loader"></div></div>';
            } else {
                modalContent.innerHTML = contentHtml;
            }
            modalOverlay.classList.add('visible');
        }

        /**
         * Hides the modal.
         */
        function hideModal() {
            modalOverlay.classList.remove('visible');
        }

        // --- SLIDE & HELPER FUNCTIONS ---

        /**
         * Converts a pixel value from the JSON to a responsive percentage.
         * @param {number} value - The pixel value.
         * @param {'width' | 'height'} dimension - The dimension to scale against.
         * @returns {string} - The percentage string (e.g., "10.5%").
         */
        function toPercent(value, dimension) {
            if (dimension === 'width') {
                return (value / baseWidth) * 100 + '%';
            } else {
                return (value / baseHeight) * 100 + '%';
            }
        }
        
        /**
         * Calculates responsive font size based on container width.
         * @param {number} fontSize - The base font size from JSON.
         * @returns {string}
         */
        function toResponsiveFontSize(fontSize) {
            const scaledVw = (fontSize / baseWidth) * 100;
            const minPx = Math.max(10, fontSize / 3);
            return `clamp(${minPx.toFixed(2)}px, ${scaledVw.toFixed(4)}vw, ${fontSize}px)`;
        }
        
        /**
         * Adds a # prefix to a hex color if missing.
         * @param {string} color - The hex color string.
         * @returns {string}
         */
        function formatColor(color) {
            if (!color) return null;
            return color.startsWith('#') ? color : `#${color}`;
        }

        /**
         * Extracts all text content from a slide object.
         * @param {object} slide - The slide data from JSON.
         * @returns {string} - A concatenated string of all text.
         */
        function extractTextFromSlide(slide) {
            let allText = [];
            
            function findText(obj) {
                if (obj.type === 'text' && obj.text) {
                    allText.push(obj.text);
                }
                if (obj.type === 'table' && obj.data) {
                    obj.data.forEach(row => {
                        row.forEach(cell => allText.push(cell));
                    });
                }
            }
            
            slide.objects.forEach(findText);
            return allText.join('\n');
        }

        /**
         * Formats Gemini's text response (with markdown-like bullets) into HTML.
         * @param {string} text - The raw text from the API.
         * @returns {string} - HTML formatted string.
         */
        function formatTextToHtml(text) {
            return text
                .split('\n')
                .map(line => {
                    line = line.trim();
                    if (line.startsWith('•') || line.startsWith('*') || line.startsWith('-')) {
                        return `<li class="ml-4 mb-2">${line.substring(1).trim()}</li>`;
                    }
                    if (line.length > 0) {
                        return `<p class="mb-3">${line}</p>`;
                    }
                    return '';
                })
                .join('')
                .replace(/<\/li><li/g, '</li></ul><ul><li'); // Handle multiple lists
        }
        
        /**
         * Formats an array of source objects into HTML links.
         * @param {Array<{uri: string, title: string}>} sources - The sources from grounding.
         * @returns {string} - HTML string of formatted links.
         */
        function formatSources(sources) {
            if (!sources || sources.length === 0) return '';
            
            let html = '<h4 class="font-bold text-lg mt-6 mb-2 text-gray-100">Sources:</h4>';
            html += '<div>';
            sources.forEach(source => {
                html += `<a href="${source.uri}" target="_blank" rel="noopener noreferrer" class="source-link" title="${source.title}">${source.title}</a>`;
            });
            html += '</div>';
            return html;
        }
        
        /**
         * Creates a table element from JSON data.
         * @param {object} obj - The table object from the JSON.
         * @returns {HTMLTableElement} - The constructed table element.
         */
        function createTableElement(obj) {
            const table = document.createElement('table');
            table.className = 'slide-object slide-table';
            
            const tableWrapper = document.createElement('div');
            tableWrapper.className = 'slide-object';
            tableWrapper.style.left = toPercent(obj.x, 'width');
            tableWrapper.style.top = toPercent(obj.y, 'height');
            tableWrapper.style.width = toPercent(obj.width, 'width');
            tableWrapper.style.height = toPercent(obj.height, 'height');
            tableWrapper.style.overflow = 'hidden'; // Contain the table

            const data = obj.data || [];
            const headerRow = obj.headerRow || false;
            const rowColors = obj.rowColors || ['#FFFFFF', '#F0F0F0'];
            const fontColor = formatColor(obj.fontColor) || '#000000';
            const borderColor = formatColor(obj.borderColor) || '#DDDDDD';
            const headerColor = formatColor(obj.headerColor) || rowColors[0];
            const headerFontColor = formatColor(obj.headerFontColor) || fontColor;
            const baseFontSize = obj.fontSize || 16;
            const columnWidths = obj.columnWidths || [];

            let head, body;

            if (headerRow && data.length > 0) {
                head = table.createTHead();
                const row = head.insertRow();
                row.style.backgroundColor = headerColor;
                data[0].forEach((cellData, index) => {
                    const th = document.createElement('th');
                    th.textContent = cellData;
                    th.style.color = headerFontColor;
                    th.style.borderColor = borderColor;
                    th.style.fontWeight = obj.fontWeight || 'bold';
                    th.style.fontSize = toResponsiveFontSize(baseFontSize * 1.1);
                    if(columnWidths[index]) {
                        th.style.width = toPercent(columnWidths[index], 'width');
                    }
                    if(cellData === '✓' || cellData === '✗') {
                        th.style.textAlign = 'center';
                    }
                    row.appendChild(th);
                });
            }

            body = table.createTBody();
            const dataStartIndex = headerRow ? 1 : 0;
            for (let i = dataStartIndex; i < data.length; i++) {
                const row = body.insertRow();
                const colorIndex = (i - dataStartIndex) % rowColors.length;
                row.style.backgroundColor = formatColor(rowColors[colorIndex]);
                
                data[i].forEach((cellData, index) => {
                    const td = row.insertCell();
                    td.textContent = cellData;
                    td.style.color = fontColor;
                    td.style.borderColor = borderColor;
                    td.style.fontWeight = obj.fontWeight || 'normal';
                    td.style.fontSize = toResponsiveFontSize(baseFontSize);
                    
                    if(cellData === '✓' || cellData === '✗') {
                        td.style.textAlign = 'center';
                        td.style.fontSize = toResponsiveFontSize(baseFontSize * 1.2);
                        td.style.color = cellData === '✓' ? '#22C55E' : '#EF4444'; // green/red
                    }
                    row.appendChild(td);
                });
            }

            tableWrapper.appendChild(table);
            return tableWrapper;
        }

        /**
         * Renders the specified slide in the container.
         * @param {number} slideIndex - The index of the slide to render.
         */
        function renderSlide(slideIndex) {
            const slide = slides[slideIndex];
            if (!slide) return;

            slideContainer.innerHTML = '';
            slideContainer.style.backgroundColor = formatColor(slide.backgroundColor || deckData.theme.backgroundColor);

            slide.objects.forEach(obj => {
                let el;
                switch (obj.type) {
                    case 'text':
                        el = document.createElement('div');
                        el.className = 'slide-object slide-text';
                        el.textContent = obj.text;
                        el.style.color = formatColor(obj.color || deckData.theme.primaryColor);
                        el.style.fontSize = toResponsiveFontSize(obj.fontSize || 18);
                        el.style.fontWeight = obj.fontWeight || 'normal';
                        el.style.textAlign = obj.horizontalAlign || 'left';
                        el.style.lineHeight = obj.lineSpacing || 1.2;
                        break;
                    case 'image':
                        el = document.createElement('div');
                        el.className = 'slide-object slide-image';
                        el.style.backgroundImage = `url(${obj.url})`;
                        el.style.opacity = obj.opacity || 1;
                        el.style.backgroundSize = obj.objectFit || 'cover';
                        if (obj.borderRadius) {
                            el.style.borderRadius = toPercent(obj.borderRadius, 'width');
                        }
                        const img = new Image();
                        img.onerror = () => {
                            el.style.backgroundImage = 'none';
                            el.style.backgroundColor = '#222';
                            el.innerHTML = `<span class="text-red-500 p-2 text-xs">Image not found:<br>${obj.url.split('/').pop()}</span>`;
                        };
                        img.src = obj.url;
                        break;
                    case 'shape':
                        el = document.createElement('div');
                        el.className = 'slide-object slide-shape';
                        el.style.backgroundColor = formatColor(obj.backgroundColor);
                        if (obj.borderRadius) {
                            el.style.borderRadius = toPercent(obj.borderRadius, 'width');
                        }
                        break;
                    case 'table':
                        el = createTableElement(obj);
                        break;
                    default:
                        console.warn('Unknown object type:', obj.type);
                        return;
                }
                if (obj.type !== 'table') {
                    el.style.left = toPercent(obj.x, 'width');
                    el.style.top = toPercent(obj.y, 'height');
                    el.style.width = toPercent(obj.width, 'width');
                    el.style.height = toPercent(obj.height, 'height');
                }
                slideContainer.appendChild(el);
            });

            // --- SPECIAL GEMINI FEATURES ---
            // Add AI-powered buttons to specific slides
            const slideButtons = {
                4: { text: '✨ Explore Texas Market', handler: handleExploreTexasMarket, x: 1000, y: 50 },
                9: { text: '✨ Research Leader', handler: handleResearchLeader, x: 50, y: 630 },
                12: { text: '✨ Analyze Projections', handler: handleAnalyzeProjections, x: 900, y: 85 },
                13: { text: '✨ Analyze Competitors', handler: handleAnalyzeCompetitors, x: 900, y: 85 },
                15: { text: '✨ Valuation Analysis', handler: handleValuationAnalysis, x: 900, y: 85 }
            };

            if (slideButtons[slide.slideNumber]) {
                const config = slideButtons[slide.slideNumber];
                const aiButton = document.createElement('button');
                aiButton.className = 'on-slide-button';
                aiButton.textContent = config.text;
                aiButton.style.left = toPercent(config.x, 'width');
                aiButton.style.top = toPercent(config.y, 'height');
                aiButton.addEventListener('click', config.handler);
                slideContainer.appendChild(aiButton);
            }

            updateControls();
        }

        /**
         * Updates the state and text of navigation controls.
         */
        function updateControls() {
            slideCounter.textContent = `Slide ${currentSlideIndex + 1} / ${totalSlides}`;
            fsSlideCounter.textContent = `${currentSlideIndex + 1} / ${totalSlides}`;
            prevButton.disabled = (currentSlideIndex === 0);
            nextButton.disabled = (currentSlideIndex === totalSlides - 1);

            // Update progress bar
            const progress = ((currentSlideIndex + 1) / totalSlides) * 100;
            progressBar.style.width = `${progress}%`;

            // Update thumbnail active state
            document.querySelectorAll('.thumbnail').forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentSlideIndex);
            });
        }

        // --- THUMBNAIL FUNCTIONS ---

        /**
         * Generates thumbnail elements for all slides.
         */
        function generateThumbnails() {
            thumbnailList.innerHTML = '';
            slides.forEach((slide, index) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumbnail' + (index === currentSlideIndex ? ' active' : '');
                thumb.dataset.index = index;

                // Create a mini preview with slide title
                const title = getSlideTitle(slide);
                thumb.innerHTML = `
                    <div style="padding: 6px; font-size: 9px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        ${title}
                    </div>
                    <span class="thumbnail-number">${index + 1}</span>
                `;
                thumb.style.backgroundColor = formatColor(slide.backgroundColor || deckData.theme.backgroundColor);

                thumb.addEventListener('click', () => goToSlide(index));
                thumbnailList.appendChild(thumb);
            });
        }

        /**
         * Gets the title from a slide for thumbnail display.
         */
        function getSlideTitle(slide) {
            const textObj = slide.objects.find(obj => obj.type === 'text' && obj.fontSize >= 24);
            if (textObj) {
                return textObj.text.split('\n')[0].substring(0, 30);
            }
            return `Slide ${slide.slideNumber}`;
        }

        /**
         * Toggles the thumbnail panel visibility.
         */
        function toggleThumbnailPanel() {
            thumbnailPanel.classList.toggle('open');
            thumbnailToggle.classList.toggle('panel-open');
        }

        // --- TIMER FUNCTIONS ---

        /**
         * Formats seconds into MM:SS format.
         */
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        /**
         * Toggles the presentation timer.
         */
        function toggleTimer() {
            if (timerRunning) {
                clearInterval(timerInterval);
                timerToggleBtn.textContent = '▶';
                timerRunning = false;
            } else {
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    timerDisplay.textContent = formatTime(timerSeconds);
                }, 1000);
                timerToggleBtn.textContent = '⏸';
                timerRunning = true;
            }
        }

        /**
         * Resets the presentation timer.
         */
        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            timerDisplay.textContent = '00:00';
            timerToggleBtn.textContent = '▶';
            timerRunning = false;
        }

        // --- FULLSCREEN FUNCTIONS ---

        /**
         * Toggles fullscreen presentation mode.
         */
        function toggleFullscreen() {
            document.body.classList.toggle('fullscreen-mode');
            if (document.body.classList.contains('fullscreen-mode')) {
                fullscreenBtn.textContent = '⛶ Exit';
                // Auto-start timer when entering presentation mode
                if (!timerRunning) {
                    toggleTimer();
                }
            } else {
                fullscreenBtn.textContent = '⛶ Present';
            }
        }

        /**
         * Exits fullscreen mode.
         */
        function exitFullscreen() {
            document.body.classList.remove('fullscreen-mode');
            fullscreenBtn.textContent = '⛶ Present';
        }

        // --- HELP FUNCTIONS ---

        /**
         * Shows the help overlay.
         */
        function showHelp() {
            helpOverlay.classList.add('visible');
        }

        /**
         * Hides the help overlay.
         */
        function hideHelp() {
            helpOverlay.classList.remove('visible');
        }

        // --- NAVIGATION FUNCTIONS ---

        /**
         * Goes to a specific slide with transition.
         */
        function goToSlide(index) {
            if (index < 0 || index >= totalSlides || index === currentSlideIndex) return;

            slideContainer.classList.add('transitioning');
            setTimeout(() => {
                currentSlideIndex = index;
                renderSlide(currentSlideIndex);
                slideContainer.classList.remove('transitioning');
            }, 150);
        }

        /**
         * Navigates to next slide.
         */
        function nextSlide() {
            if (currentSlideIndex < totalSlides - 1) {
                goToSlide(currentSlideIndex + 1);
            }
        }

        /**
         * Navigates to previous slide.
         */
        function prevSlide() {
            if (currentSlideIndex > 0) {
                goToSlide(currentSlideIndex - 1);
            }
        }

        // --- TOUCH/SWIPE FUNCTIONS ---

        /**
         * Handles touch start event.
         */
        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
        }

        /**
         * Handles touch end event and determines swipe direction.
         */
        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }

        /**
         * Processes swipe gesture.
         */
        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    nextSlide(); // Swipe left = next
                } else {
                    prevSlide(); // Swipe right = previous
                }
            }
        }

        // --- EVENT HANDLERS ---

        /**
         * Handles the click for "Generate Speaker Notes".
         */
        async function handleGenerateSpeakerNotes() {
            const slide = slides[currentSlideIndex];
            const slideText = extractTextFromSlide(slide);
            
            const systemPrompt = "You are a world-class pitch coach. You will be given the content of a pitch deck slide. Generate compelling, concise speaker notes for the presenter. The notes should expand on the slide's points, not just repeat them, and should be in a conversational, professional tone. Format the notes as bullet points.";
            const userPrompt = `Generate speaker notes for this slide:\n\n${slideText}`;
            
            showModal("Generating Speaker Notes...", "", true);
            
            const { text } = await callGemini(systemPrompt, userPrompt, false);
            const htmlContent = formatTextToHtml(text);
            
            showModal("✨ Speaker Notes", `<ul>${htmlContent}</ul>`);
        }

        /**
         * Handles the click for "Analyze Competitors" (Slide 13).
         */
        async function handleAnalyzeCompetitors() {
            const systemPrompt = "You are a market analyst. Summarize the provided search results about the youth sports academy market in 3-4 key bullet points. Focus on IMG Academy's business model, cost, and the general 'club sports' industry.";
            const userPrompt = "Find recent news or analysis on the youth sports academy market, focusing on IMG Academy's business model and the 'club sports' industry.";

            showModal("Analyzing Market...", "", true);

            const { text, sources } = await callGemini(systemPrompt, userPrompt, true);
            const htmlContent = `<ul>${formatTextToHtml(text)}</ul>` + formatSources(sources);

            showModal("✨ Market Analysis", htmlContent);
        }

        /**
         * Handles the click for "Analyze Projections" (Slide 12 - Financial).
         */
        async function handleAnalyzeProjections() {
            const slide = slides[11]; // Slide 12 is index 11
            const slideText = extractTextFromSlide(slide);

            const systemPrompt = "You are a financial analyst specializing in EdTech and education startups. Analyze the financial projections provided. Comment on: 1) The growth trajectory and whether it's realistic, 2) The EBITDA margins, 3) Key risks and assumptions, 4) How it compares to typical EdTech growth. Be concise but insightful.";
            const userPrompt = `Analyze these financial projections for a sports academy:\n\n${slideText}`;

            showModal("Analyzing Projections...", "", true);

            const { text } = await callGemini(systemPrompt, userPrompt, false);
            const htmlContent = formatTextToHtml(text);

            showModal("✨ Financial Analysis", `<div>${htmlContent}</div>`);
        }

        /**
         * Handles the click for "Research Leader" (Slide 9 - Team).
         */
        async function handleResearchLeader() {
            const systemPrompt = "You are a business researcher. Find and summarize information about Joe Liemandt, focusing on his business background, notable achievements, and his involvement in education. Provide 4-5 key facts in bullet point format.";
            const userPrompt = "Research Joe Liemandt, billionaire entrepreneur and founder. What is his background with Trilogy Software and his recent education ventures?";

            showModal("Researching...", "", true);

            const { text, sources } = await callGemini(systemPrompt, userPrompt, true);
            const htmlContent = `<ul>${formatTextToHtml(text)}</ul>` + formatSources(sources);

            showModal("✨ Leadership Research", htmlContent);
        }

        /**
         * Handles the click for "Explore Texas Market" (Slide 4).
         */
        async function handleExploreTexasMarket() {
            const systemPrompt = "You are a market research analyst. Provide insights on why Texas is an attractive market for education startups and private schools. Focus on: demographics, school choice policies, economic factors, and competition. Format as concise bullet points.";
            const userPrompt = "Research the Texas education market: Why is Texas a good state for private schools and education startups? What are the key demographic and policy factors?";

            showModal("Researching Texas Market...", "", true);

            const { text, sources } = await callGemini(systemPrompt, userPrompt, true);
            const htmlContent = `<ul>${formatTextToHtml(text)}</ul>` + formatSources(sources);

            showModal("✨ Texas Market Insights", htmlContent);
        }

        /**
         * Handles the click for "Valuation Analysis" (Slide 15 - Required Capital).
         */
        async function handleValuationAnalysis() {
            const slide = slides[14]; // Slide 15 is index 14
            const slideText = extractTextFromSlide(slide);

            const systemPrompt = "You are an investment analyst. Analyze the funding ask and valuation. Comment on: 1) Whether a $1B pre-money valuation is reasonable, 2) How the use of funds breakdown looks, 3) Comparable deals in EdTech. Be direct and analytical.";
            const userPrompt = `Analyze this funding ask and valuation:\n\n${slideText}`;

            showModal("Analyzing Valuation...", "", true);

            const { text } = await callGemini(systemPrompt, userPrompt, false);
            const htmlContent = formatTextToHtml(text);

            showModal("✨ Valuation Analysis", `<div>${htmlContent}</div>`);
        }


        // --- EVENT LISTENERS ---

        // Navigation buttons
        prevButton.addEventListener('click', prevSlide);
        nextButton.addEventListener('click', nextSlide);

        // Fullscreen navigation
        fsPrevBtn.addEventListener('click', prevSlide);
        fsNextBtn.addEventListener('click', nextSlide);
        fsExitBtn.addEventListener('click', exitFullscreen);

        // Speaker notes
        speakerNotesButton.addEventListener('click', handleGenerateSpeakerNotes);

        // Modal controls
        modalCloseButton.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                hideModal();
            }
        });

        // Thumbnail panel
        thumbnailToggle.addEventListener('click', toggleThumbnailPanel);

        // Timer controls
        timerToggleBtn.addEventListener('click', toggleTimer);
        timerResetBtn.addEventListener('click', resetTimer);

        // Fullscreen button
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Help button and overlay
        helpBtn.addEventListener('click', showHelp);
        helpOverlay.addEventListener('click', hideHelp);
        helpOverlay.addEventListener('keydown', hideHelp);

        // Touch/swipe support
        slideContainer.addEventListener('touchstart', handleTouchStart, { passive: true });
        slideContainer.addEventListener('touchend', handleTouchEnd, { passive: true });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Don't handle keys when modal is open (except Escape)
            const modalVisible = modalOverlay.classList.contains('visible');
            const helpVisible = helpOverlay.classList.contains('visible');

            if (helpVisible) {
                hideHelp();
                return;
            }

            if (e.key === 'Escape') {
                if (modalVisible) {
                    hideModal();
                } else if (document.body.classList.contains('fullscreen-mode')) {
                    exitFullscreen();
                }
                return;
            }

            if (modalVisible) return;

            switch (e.key) {
                case 'ArrowRight':
                case 'PageDown':
                    nextSlide();
                    break;
                case 'ArrowLeft':
                case 'PageUp':
                    prevSlide();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case 't':
                case 'T':
                    toggleThumbnailPanel();
                    break;
                case ' ':
                    e.preventDefault();
                    toggleTimer();
                    break;
                case '?':
                    showHelp();
                    break;
                case 'Home':
                    goToSlide(0);
                    break;
                case 'End':
                    goToSlide(totalSlides - 1);
                    break;
            }
        });

        // Number keys to jump to slides (1-9)
        document.addEventListener('keydown', (e) => {
            const modalVisible = modalOverlay.classList.contains('visible');
            const helpVisible = helpOverlay.classList.contains('visible');
            if (modalVisible || helpVisible) return;

            const num = parseInt(e.key);
            if (!isNaN(num) && num >= 1 && num <= 9) {
                goToSlide(num - 1);
            }
        });

        // --- INITIAL RENDER ---
        generateThumbnails();
        renderSlide(currentSlideIndex);

    </script>
